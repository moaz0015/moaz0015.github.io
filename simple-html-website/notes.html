<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
</head>
<body>
    <header><h1>Notes</h1></header>
    <dl>
        <dt>h1, h2, h3, etc.</dt>
        <dd>Displays header text. The larger number means that it is smaller and less important.</dd>
        
        <dt>title</dt>
        <dd>Sets the title of the tab.</dd>
        
        <dt>a</dt>
        <dd>Displays a link.</dd>
        
        <dt>img</dt>
        <dd>Displays an image.</dd>
        
        <dt>hr</dt>
        <dd>Displays a horizontal line in between the page.</dd>
    </dl>
    <a href="index.html">Back to index</a>
</body>
</html>
